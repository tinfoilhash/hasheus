name: ci

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      # `shell: bash` adds pipefail, so a failing test is caught through tee.
      # the summary is written either way, then the step fails if tests did.
      - name: test
        shell: bash
        run: |
          status=0
          npm run test:coverage | tee "$RUNNER_TEMP/coverage.txt" || status=$?
          {
            echo '### unit test coverage'
            echo '```'
            sed -n '/% Stmts/,$p' "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: build
        run: npm run build
