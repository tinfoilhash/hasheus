name: ci

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # installs vite+, the node.js and pnpm versions in `devEngines`, and dependencies.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: lint
        run: vp run lint

      # `shell: bash` adds pipefail, so a failing test is caught through tee.
      # the summary is written either way, then the step fails if tests did.
      - name: test
        shell: bash
        run: |
          status=0
          vp test --coverage | tee "$RUNNER_TEMP/coverage.txt" || status=$?
          {
            echo '### unit test coverage'
            echo '```'
            sed -n '/% Stmts/,$p' "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: build
        run: vp build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # installs vite+, the node.js and pnpm versions in `devEngines`, and dependencies.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # the tests run against a local nak relay, pinned by its checksum.
      - name: install nak
        env:
          NAK_VERSION: v0.21.2
          NAK_SHA256: 0acd56fea6ab1b9a0a68c8615670c6f8eff9e8878922442e387b94ee15266bb8
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/nak" \
            "https://github.com/fiatjaf/nak/releases/download/$NAK_VERSION/nak-$NAK_VERSION-linux-amd64"
          echo "$NAK_SHA256  $RUNNER_TEMP/nak" | sha256sum --check
          chmod +x "$RUNNER_TEMP/nak"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: install browsers
        run: vp exec playwright install --with-deps chromium firefox webkit

      - name: end-to-end tests
        run: vp run test:e2e

      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
