# vite+ manages the node.js and pnpm versions in `devEngines`, so pnpm doesn't
# switch versions itself.
pmOnFail: ignore
runtimeOnFail: ignore

allowBuilds:
  fsevents: false

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.5.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.5.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.5.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.5.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.5.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.5.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.5.0'
  - vite-plus@1.5.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
  vite-plus: 1.5.0
  '@vitest/coverage-v8': 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
# re-indents multi-line comments in lit styles: https://github.com/43081j/postcss-lit/issues/58
patchedDependencies:
  postcss-lit@1.4.1: patches/postcss-lit@1.4.1.patch
